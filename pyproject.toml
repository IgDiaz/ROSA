[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosa-robotics-kit"
version = "0.3.1"
description = "An experimental context and command layer for robot applications"
readme = "README.md"
authors = [{name = "CDT"}]
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.urls]
Homepage = "https://rosa.cdtglobal.org/"
Source = "https://github.com/IgDiaz/ROSA"
Documentation = "https://github.com/IgDiaz/ROSA/tree/main/docs"
Issues = "https://github.com/IgDiaz/ROSA/issues"

[project.scripts]
rosa = "rosa.__main__:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSE-CDT", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
rosa = ["web/index.html", "web/favicon.svg"]

[tool.setuptools.packages.find]
include = ["rosa*"]
