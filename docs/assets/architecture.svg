<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">ROSA context and command architecture</title><desc id="desc">ROS 2 telemetry or simulated observations feed Colomos. An operator command and current context feed Tequila. Minerva validates the structured proposal against current evidence and operating requirements. Blocked proposals return an explanation; ready proposals require operator confirmation and another check before idempotent simulation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#896452"/></marker></defs><rect width="1200" height="790" rx="18" fill="#efe5d4"/><g font-family="Arial, sans-serif"><text x="48" y="46" font-size="25" font-weight="700" fill="#501d30">ROSA / From evidence to an explained decision</text><text x="48" y="74" font-size="15" fill="#795d50">Local simulation path · ROS 2 observation through upstream libraries</text></g><g transform="translate(60 108)" font-family="Arial, sans-serif"><rect width="460" height="95" rx="12" fill="#fcf8f0" stroke="#bea590"/><text x="22" y="34" font-size="22" font-weight="700" fill="#501d30">Telemetry</text><text x="22" y="62" font-size="16" fill="#795d50">ROS 2 observer / simulator</text></g><g transform="translate(680 108)" font-family="Arial, sans-serif"><rect width="460" height="95" rx="12" fill="#fcf8f0" stroke="#bea590"/><text x="22" y="34" font-size="22" font-weight="700" fill="#501d30">Operator command</text><text x="22" y="62" font-size="16" fill="#795d50">“Inspect line 2”</text></g><g transform="translate(60 267)" font-family="Arial, sans-serif"><rect width="460" height="119" rx="12" fill="#fcf8f0" stroke="#bea590"/><text x="22" y="34" font-size="22" font-weight="700" fill="#501d30">Colomos / context</text><text x="22" y="62" font-size="16" fill="#795d50">Scoped memory, freshness and provenance</text><text x="22" y="86" font-size="16" fill="#795d50">Persisted requirements per robot</text></g><g transform="translate(680 267)" font-family="Arial, sans-serif"><rect width="460" height="119" rx="12" fill="#fcf8f0" stroke="#bea590"/><text x="22" y="34" font-size="22" font-weight="700" fill="#501d30">Tequila / interpretation</text><text x="22" y="62" font-size="16" fill="#795d50">Offline rules or optional local AI</text><text x="22" y="86" font-size="16" fill="#795d50">Produces a structured proposal</text></g><g transform="translate(365 456)" font-family="Arial, sans-serif"><rect width="470" height="119" rx="12" fill="#501d30" stroke="#bea590"/><text x="22" y="34" font-size="22" font-weight="700" fill="#f5ead9">Minerva / validation</text><text x="22" y="62" font-size="16" fill="#dec5b7">Check current evidence and requirements</text><text x="22" y="86" font-size="16" fill="#dec5b7">Bind proposal to revision and expiration</text></g><g transform="translate(60 647)" font-family="Arial, sans-serif"><rect width="470" height="103" rx="12" fill="#fcf8f0" stroke="#bea590"/><text x="22" y="34" font-size="22" font-weight="700" fill="#501d30">Explain and refresh</text><text x="22" y="62" font-size="16" fill="#795d50">Blocked proposals retain a clear reason</text><text x="22" y="86" font-size="16" fill="#795d50">Acquire new evidence before trying again</text></g><g transform="translate(670 627)" font-family="Arial, sans-serif"><rect width="470" height="143" rx="12" fill="#fcf8f0" stroke="#bea590"/><text x="22" y="34" font-size="22" font-weight="700" fill="#501d30">Confirm and recheck</text><text x="22" y="62" font-size="16" fill="#795d50">Operator reviews the proposal</text><text x="22" y="86" font-size="16" fill="#795d50">Recheck current evidence and expiration</text><text x="22" y="110" font-size="16" fill="#795d50">If valid: simulate once and record the result</text></g><path d="M290 203V261" fill="none" stroke="#896452" stroke-width="2" marker-end="url(#arrow)"/><path d="M910 203V261" fill="none" stroke="#896452" stroke-width="2" marker-end="url(#arrow)"/><path d="M520 320H674" fill="none" stroke="#896452" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#795d50">Context</text><path d="M290 386V417H470V450" fill="none" stroke="#896452" stroke-width="2" marker-end="url(#arrow)"/><path d="M910 386V417H730V450" fill="none" stroke="#896452" stroke-width="2" marker-end="url(#arrow)"/><path d="M470 575V609H295V641" fill="none" stroke="#896452" stroke-width="2" marker-end="url(#arrow)"/><text x="338" y="601" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#795d50">Blocked</text><path d="M730 575V599H905V621" fill="none" stroke="#896452" stroke-width="2" marker-end="url(#arrow)"/><text x="863" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#795d50">Ready</text></svg>