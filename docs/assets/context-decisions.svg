<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="318" viewBox="0 0 1200 318" role="img" aria-labelledby="title desc"><title id="title">One command, three context-dependent decisions</title><desc id="desc">Inspect line 2 is ready with fresh observations and 84 percent battery, blocked with 12 percent battery, and blocked when obstacle evidence expires. Examples use default simulation requirements.</desc><rect width="1200" height="318" rx="16" fill="#efe5d4"/><text x="26" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#501d30">“Inspect line 2” — the context changes the decision.</text><g transform="translate(24 64)" font-family="Arial, sans-serif"><rect width="364" height="207" rx="10" fill="#fcf8f0" stroke="#cdbbab"/><text x="20" y="31" font-family="monospace" font-size="12" fill="#795c50">01 / FRESH CONTEXT</text><text x="20" y="72" font-size="25" fill="#402a2a">84% battery</text><text x="20" y="99" font-size="13" fill="#795c50">Route clear · current observations</text><path d="M20 118H344" stroke="#d9c9b9"/><text x="20" y="155" font-size="27" font-weight="700" fill="#657449">READY</text><text x="20" y="183" font-size="13" fill="#795c50">Proposal awaits confirmation</text></g><g transform="translate(418 64)" font-family="Arial, sans-serif"><rect width="364" height="207" rx="10" fill="#fcf8f0" stroke="#cdbbab"/><text x="20" y="31" font-family="monospace" font-size="12" fill="#795c50">02 / LOW BATTERY</text><text x="20" y="72" font-size="25" fill="#402a2a">12% battery</text><text x="20" y="99" font-size="13" fill="#795c50">Movement threshold: 20%</text><path d="M20 118H344" stroke="#d9c9b9"/><text x="20" y="155" font-size="27" font-weight="700" fill="#7a344a">BLOCKED</text><text x="20" y="183" font-size="13" fill="#795c50">Reason: insufficient battery</text></g><g transform="translate(812 64)" font-family="Arial, sans-serif"><rect width="364" height="207" rx="10" fill="#fcf8f0" stroke="#cdbbab"/><text x="20" y="31" font-family="monospace" font-size="12" fill="#795c50">03 / STALE CONTEXT</text><text x="20" y="72" font-size="25" fill="#402a2a">Expired observation</text><text x="20" y="99" font-size="13" fill="#795c50">Obstacle evidence older than 3s</text><path d="M20 118H344" stroke="#d9c9b9"/><text x="20" y="155" font-size="27" font-weight="700" fill="#7a344a">BLOCKED</text><text x="20" y="183" font-size="13" fill="#795c50">Reason: refresh the evidence</text></g><text x="26" y="297" font-family="monospace" font-size="11" fill="#795c50">Illustrative simulation scenarios · configurable operating profiles · no physical actuation</text></svg>